<style>
:root { --bg: #0c0c0c; --fg: #d7e2ea; --paper: #ffffff; --ink: #0c0c0c; color-scheme: dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0c0c0c; --fg: #d7e2ea; } }
:root[data-theme="dark"] { --bg: #0c0c0c; --fg: #d7e2ea; }

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body,
#root {
  background: #0c0c0c;
  font-family: 'Kanit', sans-serif;
}

html {
  scroll-behavior: smooth;
}

.hero-heading {
  background: linear-gradient(180deg, #646973 0%, #bbccd7 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* ---------- Hero orb (stands in for a portrait) ---------- */
.orb {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  animation: orb-float 6s ease-in-out infinite;
}
.orb__glow {
  position: absolute;
  inset: 8%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(182, 0, 168, 0.55) 0%, rgba(118, 33, 176, 0.25) 45%, transparent 70%);
  filter: blur(40px);
}
.orb__sphere {
  position: absolute;
  inset: 18%;
  border-radius: 50%;
  background:
    radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.85) 0%, rgba(255, 214, 244, 0.5) 7%, transparent 22%),
    radial-gradient(circle at 70% 78%, rgba(190, 76, 0, 0.75) 0%, transparent 38%),
    radial-gradient(circle at 38% 36%, #e46bd8 0%, #b600a8 30%, #7621b0 62%, #18011f 100%);
  box-shadow:
    inset -18px -22px 60px rgba(12, 0, 20, 0.85),
    inset 10px 12px 40px rgba(255, 190, 240, 0.25),
    0 30px 80px rgba(118, 33, 176, 0.45);
}
.orb__ring {
  position: absolute;
  inset: 4%;
  border-radius: 50%;
  border: 2px solid rgba(215, 226, 234, 0.35);
  transform: rotateX(72deg) rotateZ(0deg);
  animation: orb-spin 14s linear infinite;
}
.orb__ring--b {
  inset: 10%;
  border-color: rgba(190, 76, 0, 0.45);
  transform: rotateX(72deg) rotateY(38deg);
  animation-duration: 20s;
  animation-direction: reverse;
}
.orb__ring::after {
  content: '';
  position: absolute;
  top: -7px;
  left: 50%;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #d7e2ea;
  box-shadow: 0 0 14px #d7e2ea;
}
.orb__ring--b::after {
  background: #ff9a4d;
  box-shadow: 0 0 14px #ff9a4d;
}
@keyframes orb-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-14px); }
}
@keyframes orb-spin {
  from { transform: rotateX(72deg) rotateZ(0deg); }
  to { transform: rotateX(72deg) rotateZ(360deg); }
}

/* ---------- Decorative 3D shapes (About section corners) ---------- */
.shape {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  animation: orb-float 7s ease-in-out infinite;
}
.shape--sphere {
  border-radius: 50%;
  background:
    radial-gradient(circle at 30% 26%, rgba(255, 255, 255, 0.9) 0%, transparent 18%),
    radial-gradient(circle at 40% 38%, #bbccd7 0%, #646973 55%, #1b1d22 100%);
  box-shadow: inset -14px -18px 40px rgba(0, 0, 0, 0.6), 0 24px 60px rgba(187, 204, 215, 0.15);
}
.shape--torus {
  border-radius: 50%;
  background: conic-gradient(from 200deg, #7621b0, #b600a8, #be4c00, #7621b0);
  -webkit-mask: radial-gradient(circle, transparent 36%, #000 37%);
  mask: radial-gradient(circle, transparent 36%, #000 37%);
  transform: rotate(-20deg) scaleY(0.62);
  filter: drop-shadow(0 20px 40px rgba(182, 0, 168, 0.35));
  animation: none;
}
.shape--pill {
  width: 100%;
  aspect-ratio: 5 / 2;
  border-radius: 999px;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, transparent 35%),
    linear-gradient(90deg, #be4c00 0%, #b600a8 55%, #7621b0 100%);
  box-shadow: inset 0 -12px 24px rgba(12, 0, 20, 0.55), 0 20px 50px rgba(190, 76, 0, 0.25);
  transform: rotate(-28deg);
  animation: none;
}
.cube-wrap {
  width: 100%;
  aspect-ratio: 1 / 1;
  perspective: 800px;
  display: grid;
  place-items: center;
}
.cube {
  --s: clamp(56px, 8vw, 110px);
  position: relative;
  width: var(--s);
  height: var(--s);
  transform-style: preserve-3d;
  animation: cube-spin 16s linear infinite;
}
.cube > span {
  position: absolute;
  inset: 0;
  border-radius: 14%;
  border: 1.5px solid rgba(215, 226, 234, 0.45);
  background: linear-gradient(135deg, rgba(187, 204, 215, 0.28), rgba(100, 105, 115, 0.12));
  backdrop-filter: blur(2px);
}
.cube > span:nth-child(1) { transform: translateZ(calc(var(--s) / 2)); }
.cube > span:nth-child(2) { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
.cube > span:nth-child(3) { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); }
.cube > span:nth-child(4) { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
.cube > span:nth-child(5) { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); }
.cube > span:nth-child(6) { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }
@keyframes cube-spin {
  from { transform: rotateX(-22deg) rotateY(0deg); }
  to { transform: rotateX(-22deg) rotateY(360deg); }
}

@media (prefers-reduced-motion: reduce) {
  .orb, .orb__ring, .shape, .cube { animation: none !important; }
  html { scroll-behavior: auto; }
}

// ---- FadeIn ----
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
document.querySelectorAll('.fade').forEach((el) => {
  const { x = 0, y = 30 } = el.dataset;
  el.style.transform = `translate(${x}px, ${y}px)`;
});
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => {
    if (!e.isIntersecting) return;
    const el = e.target, d = el.dataset;
    el.style.transition = `opacity ${d.dur || 0.7}s cubic-bezier(.25,.1,.25,1) ${d.d || 0}s, transform ${d.dur || 0.7}s cubic-bezier(.25,.1,.25,1) ${d.d || 0}s`;
    el.style.opacity = 1; el.style.transform = 'none';
    io.unobserve(el);
  });
}, { rootMargin: '50px', threshold: 0 });
document.querySelectorAll('.fade').forEach((el) => reduce ? (el.style.opacity = 1, el.style.transform = 'none') : io.observe(el));

// ---- Magnet ----
const mag = document.getElementById('magnet'), magIn = document.getElementById('magnet-inner');
window.addEventListener('mousemove', (e) => {

  if (Math.abs(dx) < r.width / 2 + 150 && Math.abs(dy) < r.height / 2 + 150) {
    magIn.style.transition = 'transform 0.3s ease-out'; magIn.style.transform = `translate3d(${dx / 3}px, ${dy / 3}px, 0)`;
  } else { magIn.style.transition = 'transform 0.6s ease-in-out'; magIn.style.transform = 'translate3d(0,0,0)'; }
});

// ---- Scroll-driven effects ----

const pcards = document.getElementById('pcards'), cards = [...document.querySelectorAll('.card')];
const clamp = (v) => Math.max(0, Math.min(1, v));
function onScroll() {
  const vh = window.innerHeight;
  const top = marquee.getBoundingClientRect().top + window.scrollY;
  const off = (window.scrollY - top + vh) * 0.3;
  row1.style.transform = `translateX(${off - 200}px)`;
  row2.style.transform = `translateX(${-(off - 200)}px)`;

  const ar = atext.getBoundingClientRect();
  const p = clamp((vh * 0.8 - ar.top) / (ar.height + vh * 0.6));
  const n = chars.length;
  chars.forEach((c, i) => { c.style.opacity = 0.2 + 0.8 * clamp((p - i / n) * n); });

  const pr = pcards.getBoundingClientRect();
  const pp = clamp(-pr.top / (pr.height - vh));
  cards.forEach((c, i) => {
    const target = 1 - (cards.length - 1 - i) * 0.03, start = i / cards.length;
    const t = clamp((pp - start) / (1 - start));
    c.style.transform = `scale(${1 + (target - 1) * t})`;
  });
}
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', onScroll);
onScroll();
